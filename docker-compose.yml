services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bills
      POSTGRES_PASSWORD: bills
      POSTGRES_DB: bills
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # S3-compatible storage for offline dev parity (prod uses Vercel Blob)
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bills
      MINIO_ROOT_PASSWORD: bills-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
